<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Grids - Login">
    <title>Grids - Login</title>

    <!-- Luckysheet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Theme Toggle Button -->
    <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme">
            <span class="theme-icon sun-icon">☀️</span>
            <span class="theme-icon moon-icon">🌙</span>
        </button>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Grids</h1>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="accessKey">Access Key</label>
                    <input
                        type="text"
                        id="accessKey"
                        name="accessKey"
                        placeholder="Enter your key"
                        required
                        autocomplete="off"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" id="loginBtn" class="login-btn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loading" style="display: none;">Signing in...</span>
                    </button>
                </div>

                <div id="loginError" class="login-error" style="display: none;"></div>
                <div id="loginSuccess" class="login-success" style="display: none;"></div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config/config.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/crypto-utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login-handler.js"></script>
    <script>
        // Initialize theme on login page
        document.addEventListener('DOMContentLoaded', () => {
            themeManager.init();
        });
    </script>
</body>
</html>
