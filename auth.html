<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Grids - Login">
    <title>Grids - Login</title>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Luckysheet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Theme Toggle Button -->
    <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme">
            <span class="theme-icon sun-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: currentColor; fill: none;">
                    <circle cx="12" cy="12" r="5" style="stroke: currentColor; fill: none;"></circle>
                    <line x1="12" y1="1" x2="12" y2="3" style="stroke: currentColor;"></line>
                    <line x1="12" y1="21" x2="12" y2="23" style="stroke: currentColor;"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" style="stroke: currentColor;"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" style="stroke: currentColor;"></line>
                    <line x1="1" y1="12" x2="3" y2="12" style="stroke: currentColor;"></line>
                    <line x1="21" y1="12" x2="23" y2="12" style="stroke: currentColor;"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" style="stroke: currentColor;"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" style="stroke: currentColor;"></line>
                </svg>
            </span>
            <span class="theme-icon moon-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: currentColor; fill: none;">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" style="stroke: currentColor; fill: none;"></path>
                </svg>
            </span>
        </button>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Grids</h1>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="accessKey">Access Key</label>
                    <input
                        type="text"
                        id="accessKey"
                        name="accessKey"
                        placeholder="Enter your key"
                        required
                        autocomplete="off"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" id="loginBtn" class="login-btn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loading" style="display: none;">Signing in...</span>
                    </button>
                </div>

                <div id="loginError" class="login-error" style="display: none;"></div>
                <div id="loginSuccess" class="login-success" style="display: none;"></div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config/config.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login-handler.js"></script>
    <script>
        // Initialize theme on login page and clean up service workers
        document.addEventListener('DOMContentLoaded', async () => {
            themeManager.init();

            // Clean up any service workers that might interfere with API calls
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    console.log('[AUTH] Cleaning up service workers:', registrations.length);
                    for (const registration of registrations) {
                        await registration.unregister();
                        console.log('[AUTH] Unregistered service worker:', registration.scope);
                    }
                } catch (swError) {
                    console.warn('[AUTH] Service worker cleanup error:', swError);
                }
            }
        });
    </script>
</body>
</html>
